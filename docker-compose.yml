# docker compose --env-file backend/.env up
services:

  neo4j:
    image: neo4j:5
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      # Applies when the data volume is created; to change it later use ALTER CURRENT USER.
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in backend/.env}
      # On a bigger server raise these in backend/.env; `neo4j-admin server memory-recommendation`
      # suggests the split. The page cache should fit the whole store.
      - NEO4J_server_memory_heap_initial__size=${NEO4J_HEAP:-1G}
      - NEO4J_server_memory_heap_max__size=${NEO4J_HEAP:-1G}
      - NEO4J_server_memory_pagecache_size=${NEO4J_PAGECACHE:-512m}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "-q", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 15

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:?set RABBITMQ_USER in backend/.env}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in backend/.env}

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in backend/.env}"]
    ports:
      - "127.0.0.1:6379:6379"

  worker:
    build: ./backend
    # More workers: raise the concurrency, or run copies with --scale worker=N; %h keeps names apart.
    command: celery -A celery_app worker -Q celery -n shared@%h --loglevel=info --concurrency=${WORKER_CONCURRENCY:-2}
    env_file:
      - ./backend/.env
    depends_on:
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started
      neo4j:
        condition: service_healthy

  worker-custom:
    build: ./backend
    command: celery -A celery_app worker -Q custom -n custom@%h --loglevel=info --concurrency=${CUSTOM_WORKER_CONCURRENCY:-6}
    env_file:
      - ./backend/.env
    depends_on:
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started
      neo4j:
        condition: service_healthy

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      - FORWARDED_ALLOW_IPS=*
    depends_on:
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started
      neo4j:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  neo4j_data:
