repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        language: system
        entry: cmd /c "cd frontend && npm run lint"
        files: \.(ts|tsx)$
        pass_filenames: false
